<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="FlexBen Calculator">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8eefb"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7cf7"/>
      <stop offset="1" stop-color="#2b4fd4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#page)"/>

  <!-- App mark -->
  <g transform="translate(96 175)">
    <rect width="180" height="180" rx="40" fill="url(#mark)"/>
    <g transform="scale(2.8125)" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round">
      <path d="M46 20.5a15.5 15.5 0 0 0-23.5 8"/>
      <path d="M46 43.5a15.5 15.5 0 0 1-23.5-8"/>
      <path d="M14 28.5h21"/>
      <path d="M14 36.5h21"/>
    </g>
  </g>

  <text x="330" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="700" fill="#0f172a">FlexBen Calculator</text>
  <text x="330" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="34" fill="#475569">Plan how your flexible benefits budget</text>
  <text x="330" y="382" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="34" fill="#475569">is spent across the year.</text>

  <!-- Allocation bars -->
  <g transform="translate(330 424)">
    <rect width="52" height="18" rx="9" fill="#2b4fd4" opacity=".28"/>
    <rect x="62" width="96" height="18" rx="9" fill="#2b4fd4" opacity=".48"/>
    <rect x="168" width="150" height="18" rx="9" fill="#2b4fd4" opacity=".7"/>
    <rect x="328" width="210" height="18" rx="9" fill="#2b4fd4"/>
  </g>
</svg>
